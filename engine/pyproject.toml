[project]
name = "since-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "openpyxl",
  "formulas",
  "httpx",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[tool.setuptools]
py-modules = ["app", "pipeline"]
packages = ["graph", "checks"]
