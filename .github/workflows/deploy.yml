# Every push to main deploys the whole app to Base44: entities, the workbooks function, the
# WorkbookRoom actor and the site (https://since.base44.app). Run by hand from the Actions tab too.
# Secrets: BASE44_API_KEY (a Base44 workspace API key, b44k_...) and VITE_CLERK_PUBLISHABLE_KEY.
name: Deploy to Base44

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # without a key the CLI waits for a browser login that never comes
      - name: Check secrets
        run: test -n "$BASE44_API_KEY" || { echo "::error::Set the BASE44_API_KEY repo secret (a Base44 workspace API key, b44k_...)"; exit 1; }
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Deploy
        run: npx -y base44 deploy --yes --build
        env:
          BASE44_APP_ID: 6acaab66ecbcf0974bea29c3
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
